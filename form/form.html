<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
    <style>
      body {
        font-family: "Times New Roman", Times, serif;
        background-color:;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        border-radius: 30px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background-color: #dbfbff;
        padding: 20px;
      }

      h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 30px;
        font-weight: bold;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 12px;
      }

      td {
        vertical-align: middle;
        font-size: 16px;
      }

      td:first-child {
        width: 30%;
        font-weight: normal;
      }

      input[type="text"],
      input[type="password"],
      input[type="email"],
      select,
      textarea {
        padding: 4px 6px;
        border: 1px solid #e1fdff;
        border-radius: 2px;
        box-sizing: border-box;
        font-family: inherit;
      }

      .input-full {
        width: 100%;
      }

      .name-inputs input {
        width: 45%;
      }

      .dob-inputs input {
        width: 55px;
        text-align: center;
      }

      .mobile-inputs input[type="text"]:first-child {
        width: 45px;
        text-align: center;
      }

      .mobile-inputs input[type="text"]:last-child {
        width: calc(100% - 65px);
      }

      .radio-group,
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .radio-group label,
      .checkbox-group label {
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .submit-btn {
        text-align: center;
        margin-top: 20px;
      }

      .submit-btn button {
        padding: 3px 12px;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        background-color: #cef2f7;
        border: 1px solid #d4f7fc;
        border-radius: 2px;
      }

      .submit-btn button:hover {
        background-color: #fd7bb8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Formulir pendaftaran siswa smkn 1 rongga</h1>

      <form action="#" method="POST" enctype="multipart/form-data">
        <table>
          <tr>
            <td>Nama siswa :</td>
            <td class="name-inputs">
              <input type="text" placeholder="Nama depan" /> -
              <input type="text" placeholder="Nama belakang" />
            </td>
          </tr>

          <tr>
            <td>Tanggal lahir :</td>
            <td class="dob-inputs">
              <input type="text" placeholder="Tanggal" /> -
              <input type="text" placeholder="Bulan" /> -
              <input type="text" placeholder="Tahun" />
              <i style="font-size: 15px; margin-left: 5px"></i>
            </td>
          </tr>

          <tr>
            <td>No hp :</td>
            <td class="mobile-inputs">
              <input type="text" value="+62" /> -
              <input type="text" />
            </td>
          </tr>

          <tr>
            <td>Alamat email:</td>
            <td><input type="email" class="input-full" /></td>
          </tr>

          <tr>
            <td>jenis kelamin :</td>
            <td>
              <div class="radio-group">
                <label
                  ><input type="radio" name="gender" value="Male" />
                  Laki-laki</label
                >
                <label
                  ><input type="radio" name="gender" value="Female" />
                  Perempuan</label
                >
              </div>
            </td>
          </tr>

          <tr>
            <td>Jurusan:</td>
            <td>
              <div class="radio-group">
                <label
                  ><input type="radio" name="dept" value="RPL" /> RPL</label
                >
                <label
                  ><input type="radio" name="dept" value="TBSM" /> TBSM</label
                >
                <label
                  ><input type="radio" name="dept" value="ATPH" /> ATPH</label
                >
              </div>
            </td>
          </tr>

          <tr>
            <td>Alamat :</td>
            <td><textarea class="input-full" rows="4"></textarea></td>
          </tr>
        </table>

        <div class="submit-btn">
          <button type="submit">Daftar</button>
        </div>
      </form>
    </div>
  </body>
</html>
